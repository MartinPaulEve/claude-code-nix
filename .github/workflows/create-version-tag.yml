name: Create Version Tag

on:
  workflow_run:
    workflows: ["Build and Cache"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  create-tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract version from package.nix
        id: version
        run: |
          VERSION=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' package.nix | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version tag and move latest/major tags
        run: ./scripts/update-tags.sh "${{ steps.version.outputs.version }}"

      - name: Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MAJOR="${{ steps.version.outputs.major }}"
          git fetch --tags --force origin >/dev/null 2>&1
          {
            echo "## Tag Summary"
            echo ""
            echo "| Tag | Points To |"
            echo "|-----|-----------|"
            for TAG in "v$VERSION" "v$MAJOR" latest; do
              echo "| $TAG | $(git rev-parse --short "$TAG^{commit}") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
